groups:
  - name: scielo-preservation-integrity
    rules:
      - alert: SciELOPreservationChecksumMismatch
        expr: scielo_preservation_aips_integrity_changed > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "AIP local com checksum divergente"
          description: "A ultima verificacao encontrou {{ $value }} arquivo(s) alterado(s)."

      - alert: SciELOPreservationFileMissing
        expr: scielo_preservation_aips_integrity_missing > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Arquivo de AIP ausente"
          description: "A ultima verificacao nao encontrou {{ $value }} arquivo(s) do baseline."

      - alert: SciELOPreservationScanIncomplete
        expr: scielo_preservation_scan_complete == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Verificacao de integridade incompleta"
          description: "A ultima varredura teve erro de leitura ou cobertura incompleta."

      - alert: SciELOPreservationFileWithoutBaseline
        expr: scielo_preservation_aips_integrity_without_baseline > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Arquivo sem baseline de integridade"
          description: "Existem {{ $value }} arquivo(s) ainda sem baseline aprovado."

      - alert: SciELOPreservationIntegrityCheckStale
        expr: time() - scielo_preservation_last_success_timestamp_seconds > 90000
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Verificacao de integridade conforme esta atrasada"
          description: "Nao existe uma varredura integralmente conforme nas ultimas 25 horas."

      - alert: SciELOPreservationAutomaticBaselineFailed
        expr: scielo_preservation_baseline_auto_last_run_timestamp_seconds > 0 and scielo_preservation_baseline_auto_last_run_ok == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Baseline automatico falhou"
          description: "A ultima tentativa nao registrou um baseline confiavel. Consulte o log de auditoria pelo run_id."

      - alert: SciELOPreservationReplicaMissing
        expr: scielo_preservation_replicas_missing{replica=""} > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Replica de preservacao ausente"
          description: "A ultima auditoria encontrou {{ $value }} replica(s) ausente(s)."

      - alert: SciELOPreservationReplicaChanged
        expr: scielo_preservation_replicas_changed{replica=""} > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Replica de preservacao divergente"
          description: "A ultima auditoria encontrou {{ $value }} replica(s) com tamanho ou checksum divergente."

      - alert: SciELOPreservationReplicaCheckIncomplete
        expr: scielo_preservation_replicas_scan_complete == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Auditoria de replicas incompleta"
          description: "Uma ou mais replicas nao puderam ser verificadas."

      - alert: SciELOPreservationReplicaCheckStale
        expr: scielo_preservation_replicas_last_run_timestamp_seconds > 0 and time() - scielo_preservation_replicas_last_success_timestamp_seconds > 90000
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Auditoria conforme das replicas esta atrasada"
          description: "Nao existe auditoria integralmente conforme das replicas nas ultimas 25 horas."

      - alert: SciELOPreservationBagItInvalid
        expr: scielo_preservation_bagits_invalid > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Pacote BagIt invalido"
          description: "A ultima auditoria encontrou {{ $value }} pacote(s) BagIt invalido(s)."

      - alert: SciELOPreservationBagItNoneDiscovered
        expr: scielo_preservation_bagits_last_run_timestamp_seconds > 0 and scielo_preservation_bagits_total == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Nenhum pacote BagIt descoberto"
          description: "Confira PRESERVATION_BAGIT_ROOT e as permissoes de leitura do servico."

      - alert: SciELOPreservationBagItChecksumMismatch
        expr: scielo_preservation_bagits_checksum_mismatch > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Checksum de BagIt divergente"
          description: "Um ou mais payloads ou tag files nao correspondem ao manifesto."

      - alert: SciELOPreservationBagItWeakAlgorithm
        expr: scielo_preservation_bagits_weak_algorithm > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "BagIt usa algoritmo fraco"
          description: "Existem {{ $value }} pacote(s) sem manifesto SHA-256 ou SHA-512 confiavel."

      - alert: SciELOPreservationBagItCheckIncomplete
        expr: scielo_preservation_bagits_last_run_timestamp_seconds > 0 and scielo_preservation_bagits_scan_complete == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Auditoria BagIt incompleta"
          description: "Um ou mais pacotes BagIt nao puderam ser lidos integralmente."

      - alert: SciELOPreservationBagItCheckStale
        expr: scielo_preservation_bagits_last_run_timestamp_seconds > 0 and time() - scielo_preservation_bagits_last_run_timestamp_seconds > 691200
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Auditoria BagIt atrasada"
          description: "A auditoria periodica de BagIts nao executa ha mais de oito dias."

      - alert: SciELOPreservationFormatCriticalRisk
        expr: scielo_preservation_formats_critical_risk > 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Formato em risco critico de obsolescencia"
          description: "Foram encontrados {{ $value }} arquivo(s) em formato de risco critico."

      - alert: SciELOPreservationFormatHighRisk
        expr: scielo_preservation_formats_high_risk > 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Formato em alto risco de obsolescencia"
          description: "Foram encontrados {{ $value }} arquivo(s) em formato de alto risco."

      - alert: SciELOPreservationFormatUnknown
        expr: scielo_preservation_formats_unknown > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Formato de arquivo nao identificado"
          description: "O Siegfried nao identificou {{ $value }} arquivo(s) de payload."

      - alert: SciELOPreservationFormatUnclassified
        expr: scielo_preservation_formats_unclassified > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Formato ausente da politica de preservacao"
          description: "Existem {{ $value }} arquivo(s) identificados sem regra na politica vigente."

      - alert: SciELOPreservationFormatCheckStale
        expr: scielo_preservation_formats_last_run_timestamp_seconds > 0 and time() - scielo_preservation_formats_last_run_timestamp_seconds > 3456000
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Auditoria de formatos atrasada"
          description: "A auditoria mensal de formatos nao executa ha mais de 40 dias."
