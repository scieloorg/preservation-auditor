groups:
  - name: scielo-preservation-integrity
    rules:
      - alert: SciELOPreservationChecksumMismatch
        expr: scielo_preservation_aips_integrity_changed > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "AIP local com checksum divergente"
          description: "A ultima verificacao encontrou {{ $value }} arquivo(s) alterado(s)."

      - alert: SciELOPreservationFileMissing
        expr: scielo_preservation_aips_integrity_missing > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Arquivo de AIP ausente"
          description: "A ultima verificacao nao encontrou {{ $value }} arquivo(s) do baseline."

      - alert: SciELOPreservationScanIncomplete
        expr: scielo_preservation_scan_complete == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Verificacao de integridade incompleta"
          description: "A ultima varredura teve erro de leitura ou cobertura incompleta."

      - alert: SciELOPreservationFileWithoutBaseline
        expr: scielo_preservation_aips_integrity_without_baseline > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Arquivo sem baseline de integridade"
          description: "Existem {{ $value }} arquivo(s) ainda sem baseline aprovado."

      - alert: SciELOPreservationIntegrityCheckStale
        expr: time() - scielo_preservation_last_success_timestamp_seconds > 90000
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Verificacao de integridade conforme esta atrasada"
          description: "Nao existe uma varredura integralmente conforme nas ultimas 25 horas."

      - alert: SciELOPreservationAutomaticBaselineFailed
        expr: scielo_preservation_baseline_auto_last_run_timestamp_seconds > 0 and scielo_preservation_baseline_auto_last_run_ok == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Baseline automatico falhou"
          description: "A ultima tentativa nao registrou um baseline confiavel. Consulte o log de auditoria pelo run_id."

      - alert: SciELOPreservationReplicaMissing
        expr: scielo_preservation_replicas_missing{replica=""} > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Replica de preservacao ausente"
          description: "A ultima auditoria encontrou {{ $value }} replica(s) ausente(s)."

      - alert: SciELOPreservationReplicaChanged
        expr: scielo_preservation_replicas_changed{replica=""} > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Replica de preservacao divergente"
          description: "A ultima auditoria encontrou {{ $value }} replica(s) com tamanho ou checksum divergente."

      - alert: SciELOPreservationReplicaCheckIncomplete
        expr: scielo_preservation_replicas_scan_complete == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Auditoria de replicas incompleta"
          description: "Uma ou mais replicas nao puderam ser verificadas."

      - alert: SciELOPreservationReplicaCheckStale
        expr: scielo_preservation_replicas_last_run_timestamp_seconds > 0 and time() - scielo_preservation_replicas_last_success_timestamp_seconds > 90000
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Auditoria conforme das replicas esta atrasada"
          description: "Nao existe auditoria integralmente conforme das replicas nas ultimas 25 horas."
