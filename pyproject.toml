[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "scielo-preservation-auditor"
version = "0.1.0"
description = "Auditor de preservacao do SciELO Data"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
preservation-auditor = "preservation_auditor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
